{% extends "_layout.html" %}
{% block title %}Edit Planned Item · VaultSync{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="vs-page-header">
        <div>
            <a href="{{ next_url }}" class="inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline mb-2">
                <i class="fas fa-arrow-left"></i>
                <span>Back</span>
            </a>
            <h1 class="vs-page-title">Edit Planned Item / Bucket</h1>
            <p class="vs-page-subtitle">Update schedule or reserve settings for "{{ planned.name }}"</p>
        </div>
    </div>

    <section class="vs-card">
        <form action="{{ url_for('edit_expected', id=planned.id) }}" method="POST" class="space-y-4">
            <input type="hidden" name="next" value="{{ next_url }}">

            <div class="grid grid-cols-1 sm:grid-cols-12 gap-3.5">
                <div class="sm:col-span-7">
                    <label class="vs-label" for="plan-name">Name</label>
                    <input id="plan-name" type="text" name="name" value="{{ planned.name }}" required class="vs-input">
                </div>
                <div class="sm:col-span-5">
                    <label class="vs-label" for="plan-amount">Amount (Rs.)</label>
                    <input id="plan-amount" type="number" step="0.01" min="0.01" name="amount" value="{{ planned.amount }}" required class="vs-input tabular-nums font-semibold">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-12 gap-3.5">
                <div class="sm:col-span-6">
                    <label class="vs-label" for="plan-cat">Category</label>
                    <select id="plan-cat" name="category_id" required class="vs-select">
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if cat.id == planned.category_id %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="sm:col-span-2">
                    <label class="vs-label" for="plan-day">Due Day</label>
                    <input id="plan-day" type="number" min="1" max="31" name="due_day" value="{{ planned.due_day }}" required class="vs-input">
                </div>
                <div class="sm:col-span-2">
                    <label class="vs-label" for="plan-month">Month</label>
                    <input id="plan-month" type="number" min="1" max="12" name="month" value="{{ planned.month }}" required class="vs-input">
                </div>
                <div class="sm:col-span-2">
                    <label class="vs-label" for="plan-year">Year</label>
                    <select id="plan-year" name="year" class="vs-select">
                        {% for y in year_range %}
                        <option value="{{ y }}" {% if y == planned.year %}selected{% endif %}>{{ y }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <label class="flex items-start gap-2.5 p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 cursor-pointer">
                <input type="checkbox" name="is_bucket" {% if planned.is_bucket %}checked{% endif %} class="mt-1 rounded text-indigo-600">
                <span class="text-xs">
                    <strong class="block text-slate-900 dark:text-white">Protected Spending Bucket</strong>
                    <span class="text-slate-500 dark:text-slate-400">Reserves this amount for {{ planned.category.name }} and draws down automatically as daily expenses are logged.</span>
                </span>
            </label>

            <div class="flex items-center justify-between pt-3 border-t border-slate-100 dark:border-slate-800">
                <button type="submit" form="delete-planned-form" class="vs-btn vs-btn-danger">
                    <i class="fas fa-trash"></i>
                    <span>Delete</span>
                </button>
                <div class="flex items-center gap-2">
                    <a href="{{ next_url }}" class="vs-btn vs-btn-secondary">Cancel</a>
                    <button type="submit" class="vs-btn vs-btn-primary">
                        <i class="fas fa-check"></i>
                        <span>Save Changes</span>
                    </button>
                </div>
            </div>
        </form>

        <form id="delete-planned-form" action="{{ url_for('delete_expected', id=planned.id) }}" method="POST" class="hidden" onsubmit="return confirm('Delete this planned item?');"></form>
    </section>
</div>
{% endblock %}
