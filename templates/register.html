<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Create Account · VaultSync</title>
    <script>
        (function() {
            try {
                var saved = localStorage.getItem('vaultsync-dark-mode');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (saved === 'true' || (saved === null && prefersDark)) {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3.0">
</head>
<body data-disable-chatbot="true" class="min-h-screen flex items-center justify-center p-4 sm:p-6">
    <script>
        if (document.documentElement.classList.contains('dark')) {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="w-full max-w-lg my-6">
        <!-- Brand Header -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-600 to-blue-600 text-white shadow-lg shadow-indigo-500/30 mb-3">
                <i class="fas fa-vault text-xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">Get Started with VaultSync</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Create a new family workspace or join an existing family</p>
        </div>

        <div class="vs-card p-6 sm:p-8">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="space-y-2 mb-5">
                {% for category, message in messages %}
                <div class="px-3.5 py-2.5 rounded-xl border text-xs font-medium flex items-center gap-2
                    {% if category == 'error' %}bg-rose-50 border-rose-200 text-rose-800
                    {% elif category == 'success' %}bg-emerald-50 border-emerald-200 text-emerald-800
                    {% else %}bg-indigo-50 border-indigo-200 text-indigo-800{% endif %}">
                    <i class="fas {% if category == 'error' %}fa-circle-exclamation text-rose-500{% elif category == 'success' %}fa-circle-check text-emerald-500{% else %}fa-circle-info text-indigo-500{% endif %}"></i>
                    <span>{{ message }}</span>
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <!-- Role Selector -->
            <div class="grid grid-cols-2 gap-3 mb-5" role="radiogroup" aria-label="Account role">
                <button type="button" id="role-btn-member" onclick="selectRole('family_member')" class="p-3.5 rounded-xl border-2 border-indigo-500 bg-indigo-50/70 dark:bg-indigo-500/15 text-left transition cursor-pointer">
                    <div class="flex items-center justify-between mb-1">
                        <i class="fas fa-users text-indigo-600 dark:text-indigo-400"></i>
                        <span class="text-[10px] font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">Join Existing</span>
                    </div>
                    <div class="text-sm font-bold text-slate-900 dark:text-white">Family Member</div>
                    <div class="text-[11px] text-slate-500 dark:text-slate-400">Use an invite code</div>
                </button>

                <button type="button" id="role-btn-manager" onclick="selectRole('family_manager')" class="p-3.5 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-transparent text-left transition cursor-pointer">
                    <div class="flex items-center justify-between mb-1">
                        <i class="fas fa-crown text-amber-500"></i>
                        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Create New</span>
                    </div>
                    <div class="text-sm font-bold text-slate-900 dark:text-white">Family Manager</div>
                    <div class="text-[11px] text-slate-500 dark:text-slate-400">Set up a new family</div>
                </button>
            </div>

            <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
                <input type="hidden" name="user_type" id="user_type" value="family_member">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                    <div>
                        <label class="vs-label" for="reg-username">Username</label>
                        <input id="reg-username" type="text" name="username" required minlength="3" placeholder="e.g., rahul_s" class="vs-input">
                    </div>
                    <div>
                        <label class="vs-label" for="reg-email">Email Address</label>
                        <input id="reg-email" type="email" name="email" required placeholder="you@example.com" class="vs-input">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                    <div>
                        <label class="vs-label" for="reg-password">Password</label>
                        <input id="reg-password" type="password" name="password" required minlength="6" placeholder="Min. 6 characters" class="vs-input">
                    </div>
                    <div>
                        <label class="vs-label" for="reg-confirm">Confirm Password</label>
                        <input id="reg-confirm" type="password" name="password_confirm" required minlength="6" placeholder="Repeat password" class="vs-input">
                    </div>
                </div>

                <!-- Member Fields: Invite Code -->
                <div id="member-fields" class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700">
                    <label class="vs-label" for="invite_code">Family Invite Code</label>
                    <input id="invite_code" type="text" name="invite_code" required placeholder="Paste code shared by your Family Manager" class="vs-input font-mono text-xs">
                </div>

                <!-- Manager Fields: Family Name & Initial Budget -->
                <div id="manager-fields" class="hidden p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-3">
                    <div>
                        <label class="vs-label" for="family_name">Family Workspace Name</label>
                        <input id="family_name" type="text" name="family_name" placeholder="e.g., The Sharma Family" class="vs-input">
                    </div>
                    <div>
                        <label class="vs-label" for="initial_budget">Initial Monthly Budget (Rs.)</label>
                        <input id="initial_budget" type="number" name="initial_budget" value="100000" min="1000" step="500" class="vs-input tabular-nums font-semibold">
                    </div>
                </div>

                <button type="submit" class="vs-btn vs-btn-primary w-full py-2.5 text-sm">
                    <span>Create Account</span>
                    <i class="fas fa-arrow-right text-xs"></i>
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
                <span>Already have an account? <a href="{{ url_for('login') }}" class="font-bold text-indigo-600 dark:text-indigo-400 hover:underline">Sign In</a></span>
                <button type="button" data-theme-toggle class="hover:text-indigo-500 inline-flex items-center gap-1">
                    <i class="fas fa-moon"></i> Theme
                </button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}?v=3.0"></script>
    <script>
        function selectRole(role) {
            document.getElementById('user_type').value = role;
            const memberBtn = document.getElementById('role-btn-member');
            const managerBtn = document.getElementById('role-btn-manager');
            const memberFields = document.getElementById('member-fields');
            const managerFields = document.getElementById('manager-fields');
            const inviteInput = document.getElementById('invite_code');
            const familyInput = document.getElementById('family_name');

            if (role === 'family_manager') {
                managerBtn.className = 'p-3.5 rounded-xl border-2 border-indigo-500 bg-indigo-50/70 dark:bg-indigo-500/15 text-left transition cursor-pointer';
                memberBtn.className = 'p-3.5 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-transparent text-left transition cursor-pointer';
                memberFields.classList.add('hidden');
                managerFields.classList.remove('hidden');
                inviteInput.required = false;
                familyInput.required = true;
            } else {
                memberBtn.className = 'p-3.5 rounded-xl border-2 border-indigo-500 bg-indigo-50/70 dark:bg-indigo-500/15 text-left transition cursor-pointer';
                managerBtn.className = 'p-3.5 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-transparent text-left transition cursor-pointer';
                managerFields.classList.add('hidden');
                memberFields.classList.remove('hidden');
                inviteInput.required = true;
                familyInput.required = false;
            }
        }
    </script>
</body>
</html>
